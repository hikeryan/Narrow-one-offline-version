// ---------- game data ----------
const BZ=70,AX=50,AZ=90,G=22,AS=42,rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));

 const F=(u,v,w,d,h,k,b,c,f)=>wall(u,bz+s*v,w,d,h,k,b||0,c,f);
 F(0,8,30,2,7.2,'w');F(-14,0,2,16,7.2,'w');F(14,0,2,16,7.2,'w');F(-9,-8,10,2,7.2,'w');F(9,-8,10,2,7.2,'w');F(0,-8,8.6,2,7.2,'w',5.2);

 F(0,5,9.6,4.4,10.4,'f',9.6,tc);
 [-1,1].forEach(m=>{
  for(let i=0;i<12;i++)F(m*(4.3+.6*i),-2,.6,3,.5*(i+1),'p',0,null,true);

  F(m*11.05,1.25,.3,3.5,7.2,'q',6);F(m*12.1,-3.35,1.8,.3,7.2,'q',6);F(m*7.85,3,6.5,.3,7.2,'q',6)})});
[[-18,0],[18,4],[0,-8],[-10,14],[10,-14],[0,12],[26,-20],[-26,20],[-22,-35],[22,35],[-12,-50],[12,50],[0,30],[0,-30],[30,0],[-30,0],[-35,-12],[35,12]].forEach(([x,z])=>wall(x,z,4,4,3,'o'));
const flags=[{c:null},{c:null}];
const fpos=t=>{const f=flags[t];return f.c?{x:f.c.x,y:f.c.y+2.4,z:f.c.z}:{x:base(t).x,y:0,z:base(t).z}};
const all=[];
function spawn(e){const b=base(e.t);e.x=b.x+rnd(-3.5,3.5);e.z=b.z+(e.t?1:-1)*rnd(0,5);e.y=0;e.vy=0;e.ri=0;e.hp=e.pl?100:50;e.flag=false;e.yaw=e.t?0:Math.PI}
function mk(t,i,pl){const e={t,pl,x:0,y:0,z:0,yaw:0,hp:1,cd:rnd(1,3),ph:rnd(0,9),role:i<3?1:i<5?2:0,wp:null,tm:0,flag:false};const m=i%2?1:-1;e.rt=[[m*3,-2],[m*11,-2],[m*12.1,0],[m*12.1,4.7],[m*8.5,4.7]].map(q=>loc(t,q[0],q[1]));spawn(e);all.push(e);return e}
const me=mk(0,9,true);me.pitch=0;
for(let t=0;t<2;t++)for(let i=0;i<10;i++)mk(t,i,false);
const arrows=[];let over=false,locked=false;
function gh(e){let g=0;for(const w of walls){if(w.f&&w.h<=e.y+.7&&w.h>g&&Math.abs(e.x-w.x)<w.hx&&Math.abs(e.z-w.z)<w.hz)g=w.h}return g}
function push(e,dt){e.x=cl(e.x,-AX,AX);e.z=cl(e.z,-AZ,AZ);
 for(const w of walls){if(e.y+1.8<=w.b+.1||e.y>=w.h-(w.f?.7:.3))continue;const dx=e.x-w.x,dz=e.z-w.z,px=w.hx+.5-Math.abs(dx),pz=w.hz+.5-Math.abs(dz);if(px>0&&pz>0){if(px<pz)e.x+=px*(dx<0?-1:1);else e.z+=pz*(dz<0?-1:1)}}

function dropFlag(e){if(e.flag){flags[1-e.t].c=null;e.flag=false}}

 let best=null,bd=1e9;for(const o of all){if(o.t===e.t)continue;const d=Math.hypot(o.x-e.x,o.z-e.z);if(d<bd){bd=d;best=o}}

 else if(e.role==2){let q=e.rt[e.ri];if(Math.hypot(q.x-e.x,q.z-e.z)<1&&e.ri<e.rt.length-1)q=e.rt[++e.ri];tx=q.x;tz=q.z}

let tp=false;const keys={};let yaw=Math.PI,pit=0,mcd=0;
function updateArrows(dt){

   for(const w of walls)if(a.y<w.h&&a.y>w.b&&Math.abs(a.x-w.x)<w.hx&&Math.abs(a.z-w.z)<w.hz){a.stuck=true;a.life=Math.min(a.life,3);break}
   if(a.stuck)break;
   for(const e of all){if(e.t===a.t)continue;if(Math.abs(e.x-a.x)<.7&&Math.abs(e.z-a.z)<.7&&a.y>e.y&&a.y<e.y+2.1){dmg(e,25);a.life=0;a.stuck=true;break}}
  }}

function update(dt){
 const f=[Math.sin(yaw),Math.cos(yaw)],r=[-f[1],f[0]];let mx=0,mz=0;
 if(keys.KeyW)mz++;if(keys.KeyS)mz--;if(keys.KeyD)mx++;if(keys.KeyA)mx--;mx+=jx;mz+=jz;
 const l=Math.max(1,Math.hypot(mx,mz)),sp=me.flag?6:7.5;
 me.x+=(f[0]*mz+r[0]*mx)/l*sp*dt;me.z+=(f[1]*mz+r[1]*mx)/l*sp*dt;push(me,dt);me.yaw=yaw;if(Math.abs(mx)+Math.abs(mz)>.1)me.ph+=dt*10;

function drawE(e){if(e.hp<=0||(e.pl&&!tp)||Math.hypot(e.x-me.x,e.z-me.z)>130)return;

 p(0,1.85,0,.5,.52,.5,GR);p(0,1.82,.26,.34,.09,.03,BLK);p(0,1.62,.2,.3,.1,.26,SKIN);p(0,2.16,0,.08,.14,.4,tc);

  box(0,.05,b.z,26,.1,16,[.72,.72,.74]);box(0,.1,b.z,4,.1,16,tc);box(0,.06,b.z+f*15,5,.1,14,[.45,.3,.15]);

  for(let i=0;i<7;i++){const z=b.z+f*(-6+i*3);[-19,19].forEach(x=>box(x,1,z,.3,2,.3,DK))}
